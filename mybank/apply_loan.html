<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Loan</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

/* PAGE WRAPPER */
.page {
    position: relative;
    height: 100vh;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 20px;
    right: 30px;
    padding: 8px 14px;
    background: black;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
}

.back-btn:hover {
    background: #2c3e50;
}

/* CENTER FORM */
.container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.form-box {
    width: 400px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* LABEL */
label {
    font-size: 13px;
    font-weight: 600;
}

/* INPUT */
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #f9fafb;
}

/* FOCUS */
input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #97144d, #c2185b);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}
</style>

</head>
<body>

<div class="page">

    <!-- BACK BUTTON -->
    <a href="dashboard.php" class="back-btn">←Back</a>

    <!-- FORM -->
    <div class="container">
        <div class="form-box">

            <form action="apply_loan.php" method="POST">

                <h2>Apply for Loan</h2>

                <label>Loan Type:</label>
                <select name="loan_type" required>
                    <option value="Home Loan">Home Loan</option>
                    <option value="Personal Loan">Personal Loan</option>
                    <option value="Education Loan">Education Loan</option>
                </select>

                <label>Loan Amount:</label>
                <input type="number" name="principal_amount" required>

                <label>Tenure (Months):</label>
                <input type="number" name="tenure_months" required>

                <button type="submit">Apply Loan</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
